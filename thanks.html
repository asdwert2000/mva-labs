<!DOCTYPE html>
<html lang="ru">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .thanks {
            display: flex;
            flex-direction: column;

            justify-content: center;

        .thanks .logo__multiply { font-size: 4rem; }

    </style>

<body>
    <div class="container thanks">
        <span class="logo__multiply" style="color: #A855F7; font-size: 4rem;">✓</span>
        <h1>Заявка принята!</h1>
        <p>Мы свяжемся с вами в ближайшие 15 минут в рабочее время.</p>

</html>
